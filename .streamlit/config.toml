[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
linkColor = "#1D4ED8"
borderColor = "#E2E8F0"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "6px"
font = "sans serif"
codeFont = "monospace"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "26px", "21px", "17px", "15px", "13px"]
headingFontWeights = [650, 600, 600, 550, 500, 500]
linkUnderline = false
chartCategoricalColors = ["#2563EB", "#0F766E", "#7C3AED", "#D97706", "#DC2626", "#0891B2"]

[theme.sidebar]
backgroundColor = "#F1F5F9"
secondaryBackgroundColor = "#FFFFFF"
codeBackgroundColor = "#E2E8F0"
textColor = "#0F172A"
borderColor = "#E2E8F0"
primaryColor = "#2563EB"
